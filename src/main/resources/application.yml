spring:
  application:
    name: spring-ai-agent
  # JDBC + Flyway are excluded by default so the app boots with NO database.
  # The `postgres` profile re-enables them (see profile document below).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  ai:
    mcp:
      server:
        name: spring-ai-agent-mcp
        version: 0.1.0
        type: SYNC
        sse-message-endpoint: /mcp/messages
    openai:
      # Placeholder default so the app boots and serves the UI without a key;
      # real key set via the OPENAI_API_KEY env var. Chat calls without a real
      # key degrade to a friendly 502 (see GlobalExceptionHandler).
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
          max-tokens: 800

server:
  port: 8080

# Observability: expose only health, info, and the Prometheus scrape endpoint —
# never env/heapdump/etc.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.baha.agent: INFO

agent:
  memory:
    max-messages: 20

---
# Postgres profile: re-enable JDBC + Flyway and point at a database.
# Connection defaults match docker-compose.yml; override via POSTGRES_* env vars.
# (Under Testcontainers @ServiceConnection the URL/credentials are injected.)
spring:
  config:
    activate:
      on-profile: postgres
  autoconfigure:
    exclude: []
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/agent}
    username: ${POSTGRES_USER:agent}
    password: ${POSTGRES_PASSWORD:agent}
  flyway:
    enabled: true
