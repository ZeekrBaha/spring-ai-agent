spring:
  application:
    name: spring-ai-agent
  ai:
    openai:
      # Placeholder default so the app boots and serves the UI without a key;
      # real key set via the OPENAI_API_KEY env var. Chat calls without a real
      # key degrade to a friendly 502 (see GlobalExceptionHandler).
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
          max-tokens: 800

server:
  port: 8080

logging:
  level:
    com.baha.agent: INFO
